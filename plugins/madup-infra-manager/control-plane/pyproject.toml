[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mim-control-plane"
version = "0.1.0"
description = "Control-plane startup configuration for the MADUP infra manager."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "google-auth>=2.56,<3",
    "google-cloud-bigquery>=3.26,<4",
    "google-cloud-build>=3.30,<4",
    "google-cloud-firestore>=2.18,<3",
    "google-cloud-monitoring>=2.24,<3",
    "google-cloud-run>=0.10,<1",
    "google-cloud-scheduler>=2.16,<3",
    "google-cloud-secret-manager>=2.21,<3",
    "google-cloud-tasks>=2.17,<3",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "pyjwt[crypto]>=2.9,<3",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
files = ["src"]

[tool.ruff]
extend-exclude = ["bootstrap"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
