name: MIM Public Release Advisory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mim-public-release-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run advisory generic scanner
        run: bash plugins/madup-infra-manager/infra/release/verify.sh --ci

      - name: Re-run release contract tests
        run: python3 -m unittest tests/test_public_release_guard.py tests/test_mim_release_contract.py -v
